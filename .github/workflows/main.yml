name: Find Module Files

on:
  workflow_dispatch:

jobs:
  scan:
    name: Scan Module Related Files
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find Module Files
        run: |
          echo "========================================"
          echo " MODULE RELATED FILES"
          echo "========================================"

          echo ""
          echo "[1] Exact module.c files:"
          find . -type f -name "module.c" -print | sort

          echo ""
          echo "[2] Exact module_signing.c files:"
          find . -type f -name "module_signing.c" -print | sort

          echo ""
          echo "[3] All files containing 'module' in filename:"
          find . -type f -iname "*module*" -print | sort

          echo ""
          echo "========================================"
          echo " FULL PATH + FILE SIZE"
          echo "========================================"

          find . -type f \( \
            -name "module.c" -o \
            -name "module_signing.c" \
            \) -print0 |
          while IFS= read -r -d '' file; do
            echo ""
            echo "FILE: $file"
            ls -lh "$file"
          done

          echo ""
          echo "========================================"
          echo " SEARCH COMPLETE"
          echo "========================================"
