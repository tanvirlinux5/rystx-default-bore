name: Scan PF_USED_ASYNC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Find PF_USED_ASYNC
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # Checkout Kernel Source
      # ==========================================
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ==========================================
      # Search PF_USED_ASYNC - Full Tree
      # ==========================================
      - name: Search PF_USED_ASYNC - Full Tree
        run: |
          echo "=========================================="
          echo " PF_USED_ASYNC - FULL TREE SEARCH"
          echo "=========================================="

          echo ""
          echo "Command:"
          echo 'grep -R -n "PF_USED_ASYNC" . --exclude-dir=.git 2>/dev/null || true'

          echo ""
          echo "RESULT:"
          grep -R -n "PF_USED_ASYNC" . \
            --exclude-dir=.git \
            2>/dev/null || true

      # ==========================================
      # Search PF_USED_ASYNC - include + kernel
      # ==========================================
      - name: Search PF_USED_ASYNC - include kernel
        run: |
          echo ""
          echo "=========================================="
          echo " PF_USED_ASYNC - INCLUDE + KERNEL"
          echo "=========================================="

          echo ""
          echo "Command:"
          echo 'grep -R -n "PF_USED_ASYNC" include kernel 2>/dev/null || true'

          echo ""
          echo "RESULT:"
          grep -R -n "PF_USED_ASYNC" \
            include kernel \
            2>/dev/null || true

      # ==========================================
      # Search Related Async Flags
      # ==========================================
      - name: Search Related Async Definitions
        run: |
          echo ""
          echo "=========================================="
          echo " RELATED ASYNC / TASK FLAGS"
          echo "=========================================="

          echo ""
          echo "[1] USED_ASYNC:"
          grep -R -n "USED_ASYNC" . \
            --exclude-dir=.git \
            2>/dev/null || true

          echo ""
          echo "[2] current_is_async:"
          grep -R -n "current_is_async" . \
            --exclude-dir=.git \
            2>/dev/null || true

          echo ""
          echo "[3] async_worker:"
          grep -
