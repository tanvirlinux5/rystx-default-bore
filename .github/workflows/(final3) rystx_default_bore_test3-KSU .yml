name: (final3)rystx_default_bore_test3-KSU
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (final3)rystx_default_bore_test3-KSU
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      # ==========================================
      # Checkout Kernel Source
      # ==========================================
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ==========================================
      # Install Dependencies
      # ==========================================
      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            lld \
            llvm \
            llvm-dev \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-pip \
            rsync \
            unzip \
            zip \
            wget \
            curl \
            dwarves \
            pahole

      # ==========================================
      # Download AOSP Clang 23.0.1
      # ==========================================
      - name: Download AOSP Clang 23
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/toolchains"

          cd "$GITHUB_WORKSPACE/toolchains"

          echo "Downloading AOSP Clang r614150..."

          git clone \
            --depth=1 \
            --filter=blob:none \
            --sparse \
            -b main-kernel \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86.git \
            clang-r614150

          cd clang-r614150

          git sparse-checkout set clang-r614150

          echo "Clang directory:"
          ls -la clang-r614150

      # ==========================================
      # Setup AOSP Clang
      # ==========================================
      - name: Setup AOSP Clang 23
        run: |
          set -e

          export CLANG_DIR="$GITHUB_WORKSPACE/toolchains/clang-r614150/clang-r614150"

          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"

          export PATH="$CLANG_DIR/bin:$PATH"

          echo "======================================"
          echo "AOSP Clang Version"
          echo "======================================"

          clang --version
          ld.lld --version

      # ==========================================
      # Check KernelSU Directory
      # ==========================================
      - name: Check KernelSU
        run: |
          set -e

          if [ ! -d "KernelSU/kernel" ]; then
            echo "ERROR: KernelSU/kernel not found!"
            exit 1
          fi

          echo "KernelSU directory found:"
          ls -la KernelSU/kernel

          echo ""
          echo "KernelSU files:"
          find KernelSU/kernel -maxdepth 1 -type f | sort

      # ==========================================
      # Check Defconfig
      # ==========================================
      - name: Check fog-perf_defconfig
        run: |
          set -e

          DEFCONFIG="arch/arm64/configs/vendor/fog-perf_defconfig"

          if [ ! -f "$DEFCONFIG" ]; then
            echo "ERROR: $DEFCONFIG not found!"
            exit 1
          fi

          echo "Using defconfig:"
          echo "$DEFCONFIG"

          echo ""
          echo "KSU configuration:"
          grep -n \
            -E \
            "CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_MODULE" \
            "$DEFCONFIG" || true

      # ==========================================
      # Build Kernel
      # ==========================================
      - name: Build Kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export CLANG_DIR="$GITHUB_WORKSPACE/toolchains/clang-r614150"
          export PATH="$CLANG_DIR/bin:$PATH"

          export LLVM=1
          export LLVM_IAS=1

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          mkdir -p out

          echo "======================================"
          echo "Compiler"
          echo "======================================"

          clang --version

          echo ""
          echo "======================================"
          echo "Generating fog-perf_defconfig"
          echo "======================================"

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            vendor/fog-perf_defconfig

          echo ""
          echo "======================================"
          echo "Final KernelSU Config"
          echo "======================================"

          grep -n \
            -E \
            "CONFIG_MODULE|CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_SCHED_BORE|CONFIG_LTO|CONFIG_LTO_CLANG|CONFIG_THINLTO" \
            out/.config || true

          echo ""
          echo "======================================"
          echo "Building Image.gz"
          echo "======================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            Image.gz

      # ==========================================
      # Verify Output
      # ==========================================
      - name: Verify Build Output
        if: always()
        run: |
          echo "======================================"
          echo "Kernel Output"
          echo "======================================"

          ls -lah out/arch/arm64/boot/ 2>/dev/null || true

          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo ""
            echo "Image.gz BUILD SUCCESS"
            ls -lh out/arch/arm64/boot/Image.gz
            file out/arch/arm64/boot/Image.gz
          else
            echo ""
            echo "Image.gz NOT FOUND"
          fi

      # ==========================================
      # Upload Image.gz
      # ==========================================
      - name: Upload Kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: (final3)rystx_default_bore_test3-KSU
          path: |
            out/arch/arm64/boot/Image.gz
          if-no-files-found: warn

      # ==========================================
      # Upload Build Information
      # ==========================================
      - name: Upload Build Info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: (final3_)rystx_default_bore-KSU-build-info
          path: |
            out/.config
            out/System.map
            out/Module.symvers
          if-no-files-found: warn